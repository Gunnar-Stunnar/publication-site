/><circle cx="272" cy="400" r="13" fill="#FF9A2E" stroke="#0B0E14" stroke-width="3"/><circle cx="272" cy="436" r="13" fill="#FF9A2E" stroke="#0B0E14" stroke-width="3"/><circle cx="272" cy="473" r="13" fill="#FF9A2E" stroke="#0B0E14" stroke-width="3"/><circle cx="272" cy="510" r="13" fill="#FF9A2E" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="317" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="336" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="354" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="372" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="390" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="409" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="427" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="446" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="464" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="482" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="500" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="688" cy="519" r="13" fill="#B56BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="1104" cy="330" r="13" fill="#3DF0FF" stroke="#0B0E14" stroke-width="3"/><circle cx="1104" cy="374" r="13" fill="#3DF0FF" stroke="#0B0E14" stroke-width="3"/><circle cx="1104" cy="418" r="13" fill="#3DF0FF" stroke="#0B0E14" stroke-width="3"/><circle cx="1104" cy="462" r="13" fill="#3DF0FF" stroke="#0B0E14" stroke-width="3"/><circle cx="1104" cy="506" r="13" fill="#3DF0FF" stroke="#0B0E14" stroke-width="3"/><circle cx="1520" cy="330" r="13" fill="#FFC83D" stroke="#0B0E14" stroke-width="3"/><circle cx="1520" cy="374" r="13" fill="#FFC83D" stroke="#0B0E14" stroke-width="3"/><circle cx="1520" cy="418" r="13" fill="#FFC83D" stroke="#0B0E14" stroke-width="3"/><circle cx="1520" cy="462" r="13" fill="#FFC83D" stroke="#0B0E14" stroke-width="3"/><circle cx="1520" cy="506" r="13" fill="#FFC83D" stroke="#0B0E14" stroke-width="3"/><rect x="618" y="274" width="140" height="288" rx="24" fill="none" stroke="#FF4040" stroke-width="3" stroke-dasharray="10 8"/><text x="76" y="630" font-size="21" font-weight="600" letter-spacing="2" fill="#FF9A2E">INPUT LAYER</text><text x="76" y="674" font-size="31" font-weight="600" fill="#F3F1EA">Projection neurons</text><text x="76" y="712" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">685</text><text x="76" y="752" font-size="23" fill="#AEB6C4">The odor barcode: about 50</text><text x="76" y="784" font-size="23" fill="#AEB6C4">channels, one per glomerulus.</text><text x="492" y="630" font-size="21" font-weight="600" letter-spacing="2" fill="#B56BFF">RANDOM, WIDE HIDDEN LAYER</text><text x="492" y="674" font-size="31" font-weight="600" fill="#F3F1EA">Kenyon cells</text><text x="492" y="712" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">5,177</text><text x="492" y="752" font-size="23" fill="#AEB6C4">Each samples ~5 random inputs.</text><text x="492" y="784" font-size="23" fill="#AEB6C4">50 channels spread into 5,000</text><text x="492" y="816" font-size="23" fill="#AEB6C4">makes every smell look</text><text x="492" y="848" font-size="23" fill="#AEB6C4">distinct.</text><text x="908" y="630" font-size="21" font-weight="600" letter-spacing="2" fill="#3DF0FF">OUTPUT LAYER</text><text x="908" y="674" font-size="31" font-weight="600" fill="#F3F1EA">Output neurons (MBONs)</text><text x="908" y="712" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">96</text><text x="908" y="752" font-size="23" fill="#AEB6C4">Each reads ~180 Kenyon cells</text><text x="908" y="784" font-size="23" fill="#AEB6C4">and votes “approach” or</text><text x="908" y="816" font-size="23" fill="#AEB6C4">“avoid”.</text><text x="1324" y="630" font-size="21" font-weight="600" letter-spacing="2" fill="#FFC83D">LEARNING SIGNAL</text><text x="1324" y="674" font-size="31" font-weight="600" fill="#F3F1EA">Dopamine neurons</text><text x="1324" y="712" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">331</text><text x="1324" y="752" font-size="23" fill="#AEB6C4">Reward or punishment. They re-</text><text x="1324" y="784" font-size="23" fill="#AEB6C4">weight Kenyon-to-output links:</text><text x="1324" y="816" font-size="23" fill="#AEB6C4">that change is the memory.</text></svg>