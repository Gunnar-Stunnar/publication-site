fill="#AEB6C4">Alarms from the senses, such as</text><text x="76" y="784" font-size="23" fill="#AEB6C4">looming detectors seeing a</text><text x="76" y="816" font-size="23" fill="#AEB6C4">shadow grow.</text><text x="492" y="630" font-size="21" font-weight="600" letter-spacing="2" fill="#C6FF3D">DECISION LAYERS</text><text x="492" y="674" font-size="31" font-weight="600" fill="#F3F1EA">Central brain + compass</text><text x="492" y="712" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">2,875 in central complex</text><text x="492" y="752" font-size="23" fill="#AEB6C4">Weigh the situation and keep</text><text x="492" y="784" font-size="23" fill="#AEB6C4">track of heading, like a</text><text x="492" y="816" font-size="23" fill="#AEB6C4">compass.</text><text x="908" y="630" font-size="21" font-weight="600" letter-spacing="2" fill="#FF4A3D">COMMAND BOTTLENECK</text><text x="908" y="674" font-size="31" font-weight="600" fill="#F3F1EA">Descending neurons</text><text x="908" y="712" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">1,303</text><text x="908" y="752" font-size="23" fill="#AEB6C4">Everything leaves through the</text><text x="908" y="784" font-size="23" fill="#AEB6C4">neck. A few fire as commands:</text><text x="908" y="816" font-size="23" fill="#AEB6C4">turn, walk, jump (giant fiber).</text><text x="1324" y="630" font-size="21" font-weight="600" letter-spacing="2" fill="#FFA53D">ACTUATORS</text><text x="1324" y="674" font-size="31" font-weight="600" fill="#F3F1EA">Body: nerve cord +</text><text x="1324" y="712" font-size="31" font-weight="600" fill="#F3F1EA">muscles</text><text x="1324" y="750" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">legs &amp; wings</text><text x="1324" y="790" font-size="23" fill="#AEB6C4">Turn a command into coordinated</text><text x="1324" y="822" font-size="23" fill="#AEB6C4">leg and wing movements.</text></svg>