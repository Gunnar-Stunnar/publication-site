 8" stroke="#AEB6C4" stroke-width="3" fill="none"/><circle cx="230" cy="240" r="13" fill="#5FD3FF" stroke="#0B0E14" stroke-width="3"/><circle cx="230" cy="265" r="13" fill="#5FD3FF" stroke="#0B0E14" stroke-width="3"/><circle cx="230" cy="289" r="13" fill="#5FD3FF" stroke="#0B0E14" stroke-width="3"/><circle cx="230" cy="314" r="13" fill="#5FD3FF" stroke="#0B0E14" stroke-width="3"/><circle cx="230" cy="338" r="13" fill="#5FD3FF" stroke="#0B0E14" stroke-width="3"/><circle cx="230" cy="362" r="13" fill="#5FD3FF" stroke="#0B0E14" stroke-width="3"/><circle cx="230" cy="387" r="13" fill="#5FD3FF" stroke="#0B0E14" stroke-width="3"/><circle cx="230" cy="411" r="13" fill="#5FD3FF" stroke="#0B0E14" stroke-width="3"/><circle cx="230" cy="436" r="13" fill="#5FD3FF" stroke="#0B0E14" stroke-width="3"/><circle cx="563" cy="242" r="13" fill="#6FA8FF" stroke="#0B0E14" stroke-width="3"/><circle cx="563" cy="269" r="13" fill="#6FA8FF" stroke="#0B0E14" stroke-width="3"/><circle cx="563" cy="297" r="13" fill="#6FA8FF" stroke="#0B0E14" stroke-width="3"/><circle cx="563" cy="324" r="13" fill="#6FA8FF" stroke="#0B0E14" stroke-width="3"/><circle cx="563" cy="352" r="13" fill="#6FA8FF" stroke="#0B0E14" stroke-width="3"/><circle cx="563" cy="379" r="13" fill="#6FA8FF" stroke="#0B0E14" stroke-width="3"/><circle cx="563" cy="407" r="13" fill="#6FA8FF" stroke="#0B0E14" stroke-width="3"/><circle cx="563" cy="434" r="13" fill="#6FA8FF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="238" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="258" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="278" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="298" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="318" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="338" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="358" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="378" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="398" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="418" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="896" cy="438" r="13" fill="#3D6BFF" stroke="#0B0E14" stroke-width="3"/><circle cx="1229" cy="244" r="13" fill="#2EB8E6" stroke="#0B0E14" stroke-width="3"/><circle cx="1229" cy="275" r="13" fill="#2EB8E6" stroke="#0B0E14" stroke-width="3"/><circle cx="1229" cy="307" r="13" fill="#2EB8E6" stroke="#0B0E14" stroke-width="3"/><circle cx="1229" cy="338" r="13" fill="#2EB8E6" stroke="#0B0E14" stroke-width="3"/><circle cx="1229" cy="369" r="13" fill="#2EB8E6" stroke="#0B0E14" stroke-width="3"/><circle cx="1229" cy="401" r="13" fill="#2EB8E6" stroke="#0B0E14" stroke-width="3"/><circle cx="1229" cy="432" r="13" fill="#2EB8E6" stroke="#0B0E14" stroke-width="3"/><circle cx="1562" cy="250" r="13" fill="#2EE6B0" stroke="#0B0E14" stroke-width="3"/><circle cx="1562" cy="294" r="13" fill="#2EE6B0" stroke="#0B0E14" stroke-width="3"/><circle cx="1562" cy="338" r="13" fill="#2EE6B0" stroke="#0B0E14" stroke-width="3"/><circle cx="1562" cy="382" r="13" fill="#2EE6B0" stroke="#0B0E14" stroke-width="3"/><circle cx="1562" cy="426" r="13" fill="#2EE6B0" stroke="#0B0E14" stroke-width="3"/><text x="76" y="550" font-size="21" font-weight="600" letter-spacing="2" fill="#5FD3FF">INPUT LAYER</text><text x="76" y="594" font-size="31" font-weight="600" fill="#F3F1EA">Photoreceptors</text><text x="76" y="632" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">11,391</text><text x="76" y="672" font-size="23" fill="#AEB6C4">Sense light. Each one</text><text x="76" y="704" font-size="23" fill="#AEB6C4">looks at a single spot</text><text x="76" y="736" font-size="23" fill="#AEB6C4">of the world, like a</text><text x="76" y="768" font-size="23" fill="#AEB6C4">pixel.</text><text x="409" y="550" font-size="21" font-weight="600" letter-spacing="2" fill="#6FA8FF">PREPROCESSING</text><text x="409" y="594" font-size="31" font-weight="600" fill="#F3F1EA">Lamina</text><text x="409" y="632" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">~8,400</text><text x="409" y="672" font-size="23" fill="#AEB6C4">Split the image into</text><text x="409" y="704" font-size="23" fill="#AEB6C4">“getting brighter” and</text><text x="409" y="736" font-size="23" fill="#AEB6C4">“getting darker”</text><text x="409" y="768" font-size="23" fill="#AEB6C4">channels.</text><text x="742" y="550" font-size="21" font-weight="600" letter-spacing="2" fill="#3D6BFF">WIDE FEATURE LAYER</text><text x="742" y="594" font-size="31" font-weight="600" fill="#F3F1EA">Medulla</text><text x="742" y="632" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">~58,600</text><text x="742" y="672" font-size="23" fill="#AEB6C4">Detect local features at</text><text x="742" y="704" font-size="23" fill="#AEB6C4">every spot: contrast,</text><text x="742" y="736" font-size="23" fill="#AEB6C4">color and motion</text><text x="742" y="768" font-size="23" fill="#AEB6C4">direction.</text><text x="1074" y="550" font-size="21" font-weight="600" letter-spacing="2" fill="#2EB8E6">DEEPER FEATURES</text><text x="1074" y="594" font-size="31" font-weight="600" fill="#F3F1EA">Lobula + lobula</text><text x="1074" y="632" font-size="31" font-weight="600" fill="#F3F1EA">plate</text><text x="1074" y="670" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">~10,400</text><text x="1074" y="710" font-size="23" fill="#AEB6C4">Combine spots into</text><text x="1074" y="742" font-size="23" fill="#AEB6C4">shapes, objects and</text><text x="1074" y="774" font-size="23" fill="#AEB6C4">whole-field motion.</text><text x="1407" y="550" font-size="21" font-weight="600" letter-spacing="2" fill="#2EE6B0">OUTPUT / SUMMARY</text><text x="1407" y="594" font-size="31" font-weight="600" fill="#F3F1EA">Visual projection</text><text x="1407" y="632" font-size="27" font-weight="600" fill="#F3F1EA" fill-opacity="0.85">8,038</text><text x="1407" y="672" font-size="23" fill="#AEB6C4">Send short reports to</text><text x="1407" y="704" font-size="23" fill="#AEB6C4">the brain: “something is</text><text x="1407" y="736" font-size="23" fill="#AEB6C4">looming”, “I am</text><text x="1407" y="768" font-size="23" fill="#AEB6C4">turning”.</text></svg>